[package]
name = "browser-host"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false
description = "The browser-extension native host: argv recognition, the host-mode relay, the app-side session protocol, and the browser intake custody store. Pure logic over async byte streams; the named pipe and registry live in platform-win."

[lints]
workspace = true

[dependencies]
native-browser-frame.workspace = true
observer-model.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
base64.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["io-util", "io-std"] }

[dev-dependencies]
pl-transport-win = { workspace = true, features = ["awaiting-hold"] }
rcgen.workspace = true
tokio = { workspace = true, features = ["io-util", "io-std", "test-util"] }
tempfile = "3"
