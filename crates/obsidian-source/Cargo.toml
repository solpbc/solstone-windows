[package]
name = "obsidian-source"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false
description = "The Obsidian vault source: the shared vault engine run as a background task, delivering through a journal seam as the journal's obsidian source. Pure logic over the journal seam; the transport glue lives in the app."

[lints]
workspace = true

[dependencies]
solstone-vault.workspace = true
source-counters.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "test-util"] }
