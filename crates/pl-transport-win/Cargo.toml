[package]
name = "pl-transport-win"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false
description = "Framed-mTLS PL transport, credential pairing, and upload coordination for the Windows observer. Drives observer-pl's pure wire over a rustls (ring) TLS socket with CA-fingerprint pinning + leaf-signature verification. rustls is cross-platform, so the whole crate is host-testable and the live pair+ingest gate can run off-Windows too."

[lints]
workspace = true

[dependencies]
observer-log.workspace = true
observer-pl.workspace = true
observer-model.workspace = true
spl-core.workspace = true
spl-transport.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "rt", "macros", "time", "sync"] }
rustls.workspace = true
tokio-rustls.workspace = true
rcgen.workspace = true
tokio-tungstenite.workspace = true
rustls-webpki.workspace = true
webpki-roots.workspace = true
futures-util.workspace = true
tracing.workspace = true
x509-parser = { version = "0.16", features = ["verify"] }
time = { version = "0.3.54", features = ["parsing"] }

[features]
awaiting-hold = []
transport-tests = []

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Security", "Win32_Security_Cryptography", "Win32_Foundation", "Win32_Storage_FileSystem", "System_Profile", "Security_Cryptography", "Storage_Streams"] }
winreg = "0.55"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "test-util"] }
rcgen = { workspace = true, features = ["x509-parser"] }
observer-segment.workspace = true
platform-win.workspace = true
xtask = { path = "../../xtask" }

[[test]]
name = "handshake_refusal"
required-features = ["transport-tests"]

[[test]]
name = "integration_mode"
required-features = ["transport-tests"]

[[test]]
name = "integration_worker_stack"
required-features = ["transport-tests"]

[[test]]
name = "journal_bridge_contact"
required-features = ["transport-tests"]

[[test]]
name = "mark_confirmation"
required-features = ["transport-tests"]

[[test]]
name = "observation_inertness"
required-features = ["transport-tests"]

[[test]]
name = "ordinary_request_authority"
required-features = ["transport-tests"]

[[test]]
name = "relay_pairing_round_trip"
required-features = ["transport-tests"]

[[test]]
name = "relay_round_trip"
required-features = ["transport-tests"]

[[test]]
name = "transport_round_trip"
required-features = ["transport-tests"]

[[test]]
name = "upload_lifecycle_log"
required-features = ["transport-tests"]
