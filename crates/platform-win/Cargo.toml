[package]
name = "platform-win"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false
description = "Windows platform glue: session/power notification pump, named-mutex single-instance gate, %LocalAppData% paths, and the real SegmentFs/RecoveryFs implementations. Platform-tier: windows-rs quarantine."

[lints]
workspace = true

[dependencies]
observer-model.workspace = true
observer-audio.workspace = true
observer-segment.workspace = true
observer-recovery.workspace = true
observer-hotkey.workspace = true
serde_json.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
journal-window.workspace = true
webview2-com = "=0.38.2"
windows-core = "=0.61.2"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Time",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_RemoteDesktop",
    "Win32_System_Power",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_Security_Authorization",
] }
# The browser native host's named pipe (server in the app, client in host mode).
tokio = { workspace = true, features = ["net", "time", "io-util"] }
# Per-user autostart `Run`-key registration (safe wrapper over the HKCU registry).
winreg = "0.55"
