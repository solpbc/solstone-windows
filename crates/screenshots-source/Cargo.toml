[package]
name = "screenshots-source"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false
description = "The screenshots source: the ledger, the folder rules, the count before the confirm, pause windows and delivery over a journal seam, as the journal's screenshots source. Pure logic; the folder, the converter and the transport come from the app."

[lints]
workspace = true

[dependencies]
observer-model.workspace = true
source-counters.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "test-util"] }
