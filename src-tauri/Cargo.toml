[package]
name = "solstone-windows-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false
description = "The solstone Windows observer binary: a tray-resident Tauri v2 shell over the capture engine. Thin — arg dispatch (--dump-state/--healthz), tray, Settings/About windows, and IPC."
default-run = "solstone-windows-app"

[lints]
workspace = true

[[bin]]
name = "solstone-windows-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Engine + platform sources injected at the seam.
capture-engine.workspace = true
capture-screen-encode.workspace = true
platform-win.workspace = true
capture-wgc.workspace = true
capture-wasapi.workspace = true
pl-transport-win.workspace = true
observer-model.workspace = true
observer-health.workspace = true
observer-state.workspace = true
observer-contract.workspace = true
observer-exclusion.workspace = true
observer-hotkey.workspace = true
observer-mic.workspace = true
observer-update.workspace = true
observer-log.workspace = true
journal-window.workspace = true
# The browser extension's native host; only in a build with `browser-host`.
browser-host = { workspace = true, optional = true }

serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true

tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }

# Browser/folder opening stays in Rust. Bundled renderers use fixed-destination
# commands; Journal routing classifies native navigation requests. No opener:*
# permission is granted to either webview.
tauri-plugin-opener = "2"

# Velopack-aware entry hook (VelopackApp runs first in main) + per-user install
# feed. The exact pin keeps native ci-full builds on the integration version.
velopack = { version = "=1.2.0", features = ["public-utils"] }
url = "2"

[dev-dependencies]
rcgen = { workspace = true, features = ["x509-parser"] }
tokio-rustls.workspace = true
rustls.workspace = true
spl-core.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "test-util"] }

[features]
# Default keeps the custom protocol off; release builds enable as needed.
custom-protocol = ["tauri/custom-protocol"]
# The browser extension's native host: host mode, the same-user endpoint,
# registration and the `browser` source. Off by default, and no release target
# enables it until the browser extension launches. Turning it on for owner builds
# is one line, `default = ["browser-host"]`, which the release build (and every
# gate that builds the app) then picks up with its pinned features unchanged.
browser-host = ["dep:browser-host"]
# Also admit the unpacked extension's development ids. A test preview only;
# never set by a release target.
browser-dev-host = ["browser-host"]
