[package]
name = "solstone-vault"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.97.1"
publish = false

[dependencies]
jiff = { version = "1.0.0", features = ["tzdb-bundle-always"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solstone-folder-sync = { path = "../solstone-folder-sync" }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
